<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゼロから麻雀">
<meta name="description" content="ゼロから覚える麻雀入門。レッスン・クイズ・一人麻雀で，初級から点数計算まで。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 54'%3E%3Crect x='1' y='1' width='38' height='50' rx='6' fill='%23fbf8ef' stroke='%231f7a5a' stroke-width='2'/%3E%3Ctext x='20' y='29' font-size='28' text-anchor='middle' dominant-baseline='central' fill='%23c8322c' font-family='serif' font-weight='bold'%3E中%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ゼロから麻雀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one narrow phone column on a felt-green table world; ivory tiles are the hero objects; fixed bottom tab bar. Solo play widens in landscape. */
:root{
  --bg:#ecf2ee; --surface:#ffffff; --surface2:#f5f8f6; --fg:#10231b; --muted:#56695f; --line:#d2ddd6;
  --felt:#0e6b4f; --felt-ink:#ffffff; --felt-soft:#dcebe3; --felt-deep:#0a4f3a;
  --red:#c43a2f; --red-soft:#f9e3df; --gold:#a97b10; --gold-soft:#f6ecd0;
  --ok:#1b8a55; --ok-soft:#dff2e7; --ng:#c43a2f; --ng-soft:#f9e3df;
  --tile:#fbf8ef; --tile-edge:#d8d0b8; --tile-back:#1f7a5a;
  --pr:#c8322c; --pb:#1f4fa0; --pg:#1d7a4a; --ink:#1b2440;
  --blue:#1f5fbf; --blue-soft:#e2ebfa;
  --f-display:"Dela Gothic One","Zen Maru Gothic",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-tile:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1612; --surface:#13241d; --surface2:#182c24; --fg:#e4eee8; --muted:#93aa9e; --line:#273b31;
    --felt:#34b184; --felt-ink:#05140e; --felt-soft:#173a2d; --felt-deep:#0f3326;
    --red:#ff7f70; --red-soft:#3b1d19; --gold:#e3b64b; --gold-soft:#3a2f14;
    --ok:#4bd092; --ok-soft:#12352a; --ng:#ff7f70; --ng-soft:#3b1d19;
    --tile-back:#1f7a5a; --tile-edge:#bfb697;
    --blue:#86b4ff; --blue-soft:#16294a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1612; --surface:#13241d; --surface2:#182c24; --fg:#e4eee8; --muted:#93aa9e; --line:#273b31;
  --felt:#34b184; --felt-ink:#05140e; --felt-soft:#173a2d; --felt-deep:#0f3326;
  --red:#ff7f70; --red-soft:#3b1d19; --gold:#e3b64b; --gold-soft:#3a2f14;
  --ok:#4bd092; --ok-soft:#12352a; --ng:#ff7f70; --ng-soft:#3b1d19;
  --tile-back:#1f7a5a; --tile-edge:#bfb697;
  --blue:#86b4ff; --blue-soft:#16294a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75;font-weight:500;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
select{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
b,strong{font-weight:900}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:.02em}
h2{font-size:23px}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px;line-height:1.65}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-l{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--felt)}

/* ---------- tiles ---------- */
.tile{--tw:32px;width:var(--tw);aspect-ratio:3/4;display:inline-block;flex:none;position:relative;
  background:var(--tile);border-radius:calc(var(--tw)*.14);
  box-shadow:inset 0 0 0 1px var(--tile-edge),0 calc(var(--tw)*.09) 0 var(--tile-back);margin-bottom:calc(var(--tw)*.09)}
.tile svg{width:100%;height:100%;display:block}
.trow{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end}
.xs .tile{--tw:22px}.sm .tile{--tw:27px}.md .tile{--tw:33px}.lg .tile{--tw:46px}.xl .tile{--tw:84px}
.tgroups{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.tgrp{display:flex;gap:2px;flex-direction:column;align-items:center}
.tgrp .trow{gap:2px;flex-wrap:nowrap}
.tgrp .lab{font-size:11px;font-weight:700;color:var(--muted);line-height:1}
.tgrp.head .lab{color:var(--red)}
.tile.hl{box-shadow:inset 0 0 0 2px var(--red),0 calc(var(--tw)*.09) 0 var(--red)}
.tile.good{box-shadow:inset 0 0 0 2px var(--ok),0 calc(var(--tw)*.09) 0 var(--ok)}
.tile.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line);}
.tile.ghost svg{visibility:hidden}
.tile.ghost::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);color:var(--muted);font-size:calc(var(--tw)*.5)}
/* one-row hand (14 tiles across the full phone width) */
.hand{display:flex;gap:2px;align-items:flex-end;margin-inline:-10px;padding-top:18px}
.hand .slot{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center}
.hand .slot.gap{margin-left:7px}
.hand .tile{width:100%;--tw:26px}
.hand .tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:var(--felt);white-space:nowrap;line-height:1}
.hand .tag.r{color:var(--red)}

/* ---------- common UI ---------- */
.card{background:var(--surface);border-radius:18px;padding:18px;border:1px solid var(--line)}
.note{background:var(--felt-soft);border-radius:14px;padding:14px 16px}
.warn{background:var(--red-soft);border-radius:14px;padding:14px 16px}
.warn h3,.warn .h{color:var(--red)}
.tip{background:var(--gold-soft);border-radius:14px;padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;
  background:var(--felt);color:var(--felt-ink);font-weight:900;font-size:16.5px;box-shadow:0 3px 0 var(--felt-deep);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--felt-deep)}
.btn.wide{width:100%}
.btn.sub{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #7d1f18}
.btn.gold{background:var(--gold);color:#fff;box-shadow:0 3px 0 #6d500b}
.btn.slim{min-height:44px;padding:0 16px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);min-height:40px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:900;background:var(--felt-soft);color:var(--felt);white-space:nowrap;line-height:1.6}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.say{font-family:var(--f-display);color:var(--red);font-size:17px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--f-display);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--felt);color:var(--felt-ink);font-size:15px;line-height:1}
ul.dots{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tblwrap{overflow-x:auto;margin-inline:-4px}
table.tbl{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%;min-width:300px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:12px;color:var(--muted);font-weight:900}
.tbl .lim{color:var(--red);font-weight:900}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.hero .tiles{display:flex;gap:4px}
.hero .tiles .tile{--tw:40px}
.hero .tiles .tile:nth-child(2){transform:rotate(-4deg) translateY(-3px)}
.hero .tiles .tile:nth-child(4){transform:rotate(5deg) translateY(-2px)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:900;font-size:14px;line-height:1.4}
.three span{display:block;font-family:var(--f-display);font-size:22px;color:var(--felt);font-weight:400}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:48px;border-radius:10px;font-weight:900;font-size:15px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg button small{font-size:11px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink)}
.seg button[aria-pressed="true"] small{color:var(--felt-ink);opacity:.8}
.lessons{display:flex;flex-direction:column;gap:10px}
.lcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.lcard .num{width:44px;height:58px;border-radius:7px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-edge),0 4px 0 var(--tile-back);display:grid;place-items:center;font-family:var(--f-tile);font-weight:800;font-size:24px;color:var(--ink)}
.lcard .t{font-weight:900;font-size:16px;line-height:1.4}
.lcard .d{font-size:13px;color:var(--muted);line-height:1.5}
.lcard .st{font-size:12px;font-weight:900;color:var(--muted)}
.lcard.done .st{color:var(--ok)}
.lcard.done .num{box-shadow:inset 0 0 0 2px var(--ok),0 4px 0 var(--ok)}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--felt);border-radius:99px;transition:width .3s}

/* ---------- lesson ---------- */
.lesson-body{display:flex;flex-direction:column;gap:18px}
.lesson-body .sec{display:flex;flex-direction:column;gap:10px}
.suitline{display:flex;flex-direction:column;gap:6px}
.suitline .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.suitline .nm b{font-size:18px}
.formula{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:var(--f-display);font-size:18px}
.formula .fb{display:grid;place-items:center;min-width:48px;height:48px;border-radius:12px;background:var(--felt);color:var(--felt-ink);font-size:21px;line-height:1;padding:0 6px}
.formula .fb.h{background:var(--red);color:#fff}
.ng-list{display:flex;flex-direction:column;gap:10px}
.ng-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ng-item .x{font-family:var(--f-display);color:var(--red);font-size:20px}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flow div{border-radius:14px;padding:12px;font-size:14px;line-height:1.55}
.flow .y{background:var(--ok-soft)}.flow .n{background:var(--red-soft)}
.flow b{display:block;font-size:15px;margin-bottom:2px}
.yaku{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.yaku:first-child{border-top:0;padding-top:0}
.yaku .yn{font-family:var(--f-display);font-size:20px;color:var(--felt);grid-row:span 2;min-width:4.5em;line-height:1.3}
.yaku .yd{font-size:14.5px;line-height:1.65;display:flex;flex-direction:column;gap:6px}
.ykl{display:flex;flex-direction:column}
.yk{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.yk:first-child{border-top:0;padding-top:0}
.yk-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.yk-h b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--felt)}
.yk-h .rd{font-size:12px;color:var(--muted)}
.yk p{font-size:14.5px;line-height:1.65}
.lesson-nav{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.calc{display:flex;flex-direction:column;gap:12px}
.calc .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:900;color:var(--muted)}
.calc .out{background:var(--felt);color:var(--felt-ink);border-radius:14px;padding:14px 16px}
.calc .out .v{font-family:var(--f-display);font-size:30px;line-height:1.2}
.calc .out .s{font-size:13px;opacity:.9}
.tog{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;min-height:44px}
.tog button{font-weight:900;font-size:14px}
.tog button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink)}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qprompt{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.qprompt .center{display:flex;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opts.tiles{grid-template-columns:repeat(4,1fr)}
.opt{min-height:56px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line);font-weight:900;font-size:16px;padding:8px 10px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35}
.opt:active{transform:translateY(2px)}
.opts.tiles .opt{padding:10px 0 12px}
.opts.tiles .opt .tile{--tw:48px}
.opt .trow{justify-content:center}
.opt.right{background:var(--ok-soft);box-shadow:inset 0 0 0 2.5px var(--ok),0 3px 0 var(--ok);color:var(--ok)}
.opt.wrong{background:var(--ng-soft);box-shadow:inset 0 0 0 2.5px var(--ng),0 3px 0 var(--ng);color:var(--ng)}
.opt[disabled]{cursor:default}
.verdict{font-family:var(--f-display);font-size:26px;line-height:1.2}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.qlist{display:flex;flex-direction:column;gap:10px}
.qlevel{font-family:var(--f-display);font-size:16px;color:var(--muted);margin-top:8px}
.qcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:100%}
.qcard .t{font-weight:900;font-size:16px}
.qcard .d{font-size:13px;color:var(--muted);line-height:1.5;grid-column:1}
.qcard .sc{grid-row:span 2;grid-column:2;font-size:12px;font-weight:900;color:var(--muted);text-align:right;line-height:1.3}
.qcard .sc b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--felt)}
.qcard.big{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.qcard.big .d{color:var(--felt-ink);opacity:.85}
.score-big{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--felt)}
.ctx{display:flex;gap:6px;flex-wrap:wrap}
.fulist{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.fulist span:nth-child(2n){text-align:right;font-weight:900}
.fulist .tot{border-top:1px solid var(--line);padding-top:4px;margin-top:2px}

/* ---------- solo ---------- */
.solo{display:flex;flex-direction:column;gap:12px}
.solo-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;align-items:baseline;flex-wrap:wrap}
.meter b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--fg)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:900;min-height:40px}
.switch .knob{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-pressed="true"] .knob{background:var(--felt)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(18px)}
.table{background:var(--felt-deep);border-radius:18px;padding:12px 14px;display:flex;gap:14px;min-height:100px}
.table .riv{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.table .lab{font-size:11px;font-weight:900;letter-spacing:.1em;color:#bfe3d3}
.table .dora{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none}
.table .dora .tile{--tw:30px}
.river{display:grid;grid-template-columns:repeat(6,max-content);gap:3px}
.river .tile{--tw:24px}
.river .tile.rch{transform:rotate(90deg);margin-inline:4px}
.status{border-radius:14px;padding:10px 14px;font-size:14.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line)}
.status .big{font-family:var(--f-display);font-size:19px;color:var(--felt)}
.status.tenpai .big{color:var(--red)}
.hand .tb{display:block;width:100%;transition:transform .12s}
.hand .tb.sel{transform:translateY(-9px)}
.hand .tb.dim{opacity:.35}
.hand .rec{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--gold)}
.pick{display:flex;align-items:center;gap:12px;min-height:76px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:8px}
.pick .tile{--tw:46px}
.pick .nm{flex:1;min-width:0;line-height:1.4}
.pick .nm b{font-size:17px}
.pick .ph{flex:1;color:var(--muted);font-size:14px;text-align:center}
.solo-actions{display:flex;gap:10px}
.solo-actions:empty{display:none}
.solo-actions .btn{flex:1}
.fb{border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.fb .ic{font-family:var(--f-display);font-size:18px;line-height:1.4;flex:none}
.fb.good{background:var(--ok-soft)}.fb.good .ic{color:var(--ok)}
.fb.ok{background:var(--gold-soft)}.fb.ok .ic{color:var(--gold)}
.fb.bad{background:var(--red-soft)}.fb.bad .ic{color:var(--red)}
.inline-t{display:inline-flex;vertical-align:-10px;gap:2px}
.inline-t .tile{--tw:22px}
.rotate-tip{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.rotate-tip .ph{width:18px;height:28px;border:2px solid var(--muted);border-radius:4px;flex:none;animation:rot 3s ease-in-out infinite}
@media (min-width:700px){.rotate-tip{display:none!important}}

<script>
/*LOGIC-START*/
// ===== 牌の基本 =====
// 0-8: 1-9萬, 9-17: 1-9筒, 18-26: 1-9索, 27-30: 東南西北, 31: 白, 32: 發, 33: 中
const HONOR = ['東','南','西','北','白','發','中'];
const HONOR_READ = ['トン','ナン','シャー','ペー','ハク','ハツ','チュン'];
const SUIT_KANA = ['マン','ピン','ソー'];
const SUIT_NAME = ['マンズ','ピンズ','ソーズ'];
const SEAT_NAME = {27:'東家（親）',28:'南家',29:'西家',30:'北家'};
const suitOf = t => t < 27 ? Math.floor(t / 9) : 3;
const numOf = t => t < 27 ? t % 9 + 1 : 0;
const isTermHonor = t => t >= 27 || t % 9 === 0 || t % 9 === 8;
const isSimple = t => t < 27 && t % 9 >= 1 && t % 9 <= 7;
const YAO = [0,8,9,17,18,26,27,28,29,30,31,32,33];
const TH_NUM = [0,8,9,17,18,26];
function tileName(t){ if(t < 27) return numOf(t) + SUIT_KANA[suitOf(t)]; return HONOR[t-27] + '（' + HONOR_READ[t-27] + '）'; }
function tileShort(t){ return t < 27 ? numOf(t) + SUIT_KANA[suitOf(t)] : HONOR[t-27]; }
function parseTiles(s){
  const out = []; let buf = [];
  for(const ch of s){
    if(ch >= '0' && ch <= '9') buf.push(+ch);
    else if('mpsz'.includes(ch)){ const base = {m:0,p:9,s:18,z:27}[ch]; for(const n of buf) out.push(base + n - 1); buf = []; }
  }
  return out;
}
function counts(arr){ const c = new Array(34).fill(0); for(const t of arr) c[t]++; return c; }
const sum = c => c.reduce((a,b)=>a+b,0);
function doraOf(ind){ if(ind < 27) return Math.floor(ind/9)*9 + (ind%9 + 1)%9; if(ind < 31) return 27 + (ind-27+1)%4; return 31 + (ind-31+1)%3; }

// ===== 上がり判定 =====
function decomp(c, start){
  let i = start; while(i < 34 && c[i] === 0) i++;
  if(i >= 34) return [];
  if(c[i] >= 3){ c[i]-=3; const r = decomp(c,i); c[i]+=3; if(r) return [[i,i,i], ...r]; }
  if(i < 27 && i%9 <= 6 && c[i+1] > 0 && c[i+2] > 0){
    c[i]--; c[i+1]--; c[i+2]--; const r = decomp(c,i); c[i]++; c[i+1]++; c[i+2]++;
    if(r) return [[i,i+1,i+2], ...r];
  }
  return null;
}
function allDecomp(c, start){
  let i = start; while(i < 34 && c[i] === 0) i++;
  if(i >= 34) return [[]];
  const res = [];
  if(c[i] >= 3){ c[i]-=3; for(const r of allDecomp(c,i)) res.push([[i,i,i],...r]); c[i]+=3; }
  if(i < 27 && i%9 <= 6 && c[i+1] > 0 && c[i+2] > 0){
    c[i]--; c[i+1]--; c[i+2]--; for(const r of allDecomp(c,i)) res.push([[i,i+1,i+2],...r]); c[i]++; c[i+1]++; c[i+2]++;
  }
  return res;
}
function isChiitoi(c){ let p = 0; for(let i = 0; i < 34; i++){ if(c[i] === 2) p++; else if(c[i] !== 0) return false; } return p === 7; }
function isKokushi(c){
  let pair = false;
  for(let t = 0; t < 34; t++){
    if(YAO.includes(t)){ if(c[t] === 0 || c[t] > 2) return false; if(c[t] === 2) pair = true; }
    else if(c[t]) return false;
  }
  return pair;
}
function parseAgari(c, n = 0){
  if(sum(c) !== 14 - 3*n) return null;
  for(let i = 0; i < 34; i++) if(c[i] >= 2){
    c[i]-=2; const r = decomp(c,0); c[i]+=2;
    if(r) return {type:'normal', pair:i, mentsu:r};
  }
  if(n === 0 && isChiitoi(c)) return {type:'chiitoi', pairs:c.map((k,t)=>k===2?t:-1).filter(t=>t>=0)};
  if(n === 0 && isKokushi(c)) return {type:'kokushi'};
  return null;
}
function allNormalParses(c){
  const out = [];
  for(let i = 0; i < 34; i++) if(c[i] >= 2){ c[i]-=2; for(const r of allDecomp(c,0)) out.push({pair:i, mentsu:r}); c[i]+=2; }
  return out;
}
function waitsOf(c13, n = 0){
  const w = [];
  for(let t = 0; t < 34; t++){ if(c13[t] >= 4) continue; c13[t]++; if(parseAgari(c13, n)) w.push(t); c13[t]--; }
  return w;
}

// ===== シャンテン数 =====
const _sh = new Map();
function shanten(c, n = 0){
  const key = c.join('') + n;
  if(_sh.has(key)) return _sh.get(key);
  let best = 8;
  const scan = (i, m, t, p) => {
    while(i < 34 && c[i] === 0) i++;
    if(i >= 34){ const s = 8 - 2*m - Math.min(t, 4-m) - p; if(s < best) best = s; return; }
    if(c[i] >= 3){ c[i]-=3; scan(i,m+1,t,p); c[i]+=3; }
    if(i < 27 && i%9 <= 6 && c[i+1] && c[i+2]){ c[i]--; c[i+1]--; c[i+2]--; scan(i,m+1,t,p); c[i]++; c[i+1]++; c[i+2]++; }
    if(m + t < 4){
      if(c[i] >= 2){ c[i]-=2; scan(i,m,t+1,p); c[i]+=2; }
      if(i < 27 && i%9 <= 7 && c[i+1]){ c[i]--; c[i+1]--; scan(i,m,t+1,p); c[i]++; c[i+1]++; }
      if(i < 27 && i%9 <= 6 && c[i+2]){ c[i]--; c[i+2]--; scan(i,m,t+1,p); c[i]++; c[i+2]++; }
    }
    const sv = c[i]; c[i] = 0; scan(i+1,m,t,p); c[i] = sv;
  };
  for(let i = 0; i < 34; i++) if(c[i] >= 2){ c[i]-=2; scan(0,n,0,1); c[i]+=2; }
  scan(0,n,0,0);
  if(n === 0){
    let pairs = 0, kinds = 0;
    for(const x of c){ if(x >= 2) pairs++; if(x >= 1) kinds++; }
    best = Math.min(best, 6 - pairs + Math.max(0, 7 - kinds));
    let yk = 0, yp = 0; for(const t of YAO){ if(c[t]) yk++; if(c[t] >= 2) yp = 1; }
    best = Math.min(best, 13 - yk - yp);
  }
  if(_sh.size > 60000) _sh.clear();
  _sh.set(key, best);
  return best;
}
function ukeire(c13, seen, nm = 0){
  const s = shanten(c13, nm); const types = []; let n = 0;
  for(let t = 0; t < 34; t++){
    const avail = 4 - c13[t] - (seen ? seen[t] : 0);
    if(avail <= 0) continue;
    c13[t]++; if(shanten(c13, nm) < s){ types.push(t); n += avail; } c13[t]--;
  }
  return {s, types, n};
}
function analyze14(tiles14, visible, nm = 0){
  const c = counts(tiles14); const seen = counts(visible);
  const res = {};
  for(let t = 0; t < 34; t++){ if(!c[t]) continue; c[t]--; res[t] = ukeire(c, seen, nm); c[t]++; }
  let bs = 99, bn = -1;
  for(const t in res){ const r = res[t]; if(r.s < bs || (r.s === bs && r.n > bn)){ bs = r.s; bn = r.n; } }
  const best = Object.keys(res).map(Number).filter(t => res[t].s === bs && res[t].n === bn);
  return {res, bestS: bs, bestN: bn, best};
}

// 初心者向けの「残す価値」。字牌は役牌ほど高く、数牌は真ん中ほど高い。ドラはさらに高い
function keepValue(t, opt = {}){
  let v;
  if(t >= 27){
    const yh = (t >= 31 ? 1 : 0) + (t === (opt.round ?? 27) ? 1 : 0) + (t === (opt.seat ?? 27) ? 1 : 0);
    v = yh === 0 ? 0 : yh === 1 ? 3 : 5;
  } else { const n = t % 9; v = (n === 0 || n === 8) ? 2 : (n === 1 || n === 7) ? 4 : 6; }
  if((opt.doras || []).includes(t)) v += 4;
  return v;
}
// 同じシャンテン数の中から「捨てる牌」を選ぶ。序盤（2シャンテン以上）は牌の価値を重く、終盤は受け入れ枚数を重く見る
function rankDiscards(an, opt = {}){
  const ok = Object.keys(an.res).map(Number).filter(t => !(opt.exclude || []).includes(t));
  let bs = 99; for(const t of ok) bs = Math.min(bs, an.res[t].s);
  const cands = ok.filter(t => an.res[t].s === bs);
  const score = t => bs >= 2 ? an.res[t].n - 3*keepValue(t, opt) : an.res[t].n*10 - keepValue(t, opt);
  let top = -1e9; for(const t of cands) top = Math.max(top, score(t));
  an.best = cands.filter(t => score(t) === top);
  an.bestS = bs; an.bestN = an.best.length ? an.res[an.best[0]].n : 0;
  an.score = score;
  return an;
}
// ===== 役・符・点数 =====
const isShun = g => g[0] !== g[1];
function calcPoints(han, fu, dealer, tsumo, yakuman = 0){
  let base, label = '';
  if(yakuman){ base = 8000*yakuman; label = yakuman > 1 ? `${yakuman}倍役満` : '役満'; }
  else if(han >= 13){ base = 8000; label = '数え役満'; }
  else if(han >= 11){ base = 6000; label = '三倍満'; }
  else if(han >= 8){ base = 4000; label = '倍満'; }
  else if(han >= 6){ base = 3000; label = '跳満'; }
  else { base = fu * Math.pow(2, han+2); if(han >= 5 || base >= 2000){ base = 2000; label = '満貫'; } }
  const up = x => Math.ceil(x/100)*100;
  if(tsumo){
    if(dealer){ const each = up(base*2); return {label, total:each*3, text:`${each}オール`, base}; }
    const ko = up(base), oya = up(base*2); return {label, total:ko*2+oya, text:`${ko}・${oya}`, base};
  }
  const v = up(base*(dealer ? 6 : 4));
  return {label, total:v, text:`${v}`, base};
}
function candidates(c, win, nm = 0){
  const out = [];
  for(const p of allNormalParses(c.slice())){
    const seen = new Set();
    p.mentsu.forEach((g,i) => {
      if(!g.includes(win)) return;
      const key = g.join(',') + '|' + g.indexOf(win);
      if(seen.has(key)) return; seen.add(key);
      out.push({type:'normal', pair:p.pair, mentsu:p.mentsu, winIdx:i});
    });
    if(p.pair === win) out.push({type:'normal', pair:p.pair, mentsu:p.mentsu, winIdx:-1});
  }
  if(nm === 0 && isChiitoi(c)) out.push({type:'chiitoi', pairs:c.map((n,t)=>n===2?t:-1).filter(t=>t>=0)});
  if(nm === 0 && isKokushi(c)) out.push({type:'kokushi'});
  return out;
}
const WAIT_NAME = {ryanmen:'両面', kanchan:'嵌張', penchan:'辺張', shanpon:'双碰', tanki:'単騎'};
// ctx: {win, tsumo, riichi, doubleRiichi, ippatsu, tenhou, haitei, houtei, rinshan, round, seat, dealer, dora:[表示牌], ura:[表示牌], melds:[{type:'pon'|'chi'|'minkan'|'ankan'|'kakan', tiles:[...] }], menzen(省略時は副露から判断)}
function evalCandidate(c, p, ctx){
  const melds = ctx.melds || [];
  const menzen = ctx.menzen === false ? false : melds.every(m => m.type === 'ankan');
  const kui = menzen ? 0 : 1;
  const tiles = []; c.forEach((n,t) => { for(let k = 0; k < n; k++) tiles.push(t); });
  for(const m of melds) tiles.push(...m.tiles);
  const Y = [], YM = [];
  const allHonor = tiles.every(t => t >= 27);
  const numSuits = new Set(tiles.filter(t => t < 27).map(suitOf));
  const hasHonor = tiles.some(t => t >= 27);
  const yhList = [31,32,33,ctx.round,ctx.seat];
  const yhCount = t => yhList.filter(x => x === t).length;
  let fu = 0, fuParts = [], wait = null;
  if(ctx.tenhou) YM.push(['天和',13]);
  if(p.type === 'kokushi'){ YM.push(['国士無双',13]); }
  else if(p.type === 'chiitoi'){
    if(allHonor) YM.push(['字一色',13]);
    Y.push(['七対子',2]);
    if(tiles.every(isSimple)) Y.push(['タンヤオ',1]);
    if(tiles.every(isTermHonor)) Y.push(['混老頭',2]);
    if(numSuits.size === 1){ if(hasHonor) Y.push(['混一色',3]); else Y.push(['清一色',6]); }
    fu = 25; fuParts = [['七対子は25符で固定',25]]; wait = 'tanki';
  } else {
    const G = [...p.mentsu.map((g,i) => ({g, open:false, kan:false, idx:i})),
               ...melds.map(m => ({g:m.tiles.slice(0,3), open:m.type !== 'ankan', kan:m.type.includes('kan'), idx:-9}))];
    const gs = G.map(x => x.g);
    const shuns = gs.filter(isShun), kous = gs.filter(g => !isShun(g));
    const wg = p.winIdx >= 0 ? p.mentsu[p.winIdx] : null;
    wait = p.winIdx < 0 ? 'tanki' : !isShun(wg) ? 'shanpon' : ctx.win === wg[1] ? 'kanchan'
      : ((ctx.win === wg[0] && wg[0]%9 === 6) || (ctx.win === wg[2] && wg[0]%9 === 0)) ? 'penchan' : 'ryanmen';
    const isConcealedKou = x => !isShun(x.g) && !x.open && (ctx.tsumo || x.idx !== p.winIdx);
    const anko = G.filter(isConcealedKou).length;
    const kans = G.filter(x => x.kan).length;
    if(anko === 4) YM.push([wait === 'tanki' ? '四暗刻単騎' : '四暗刻',13]);
    if(kous.filter(g => g[0] >= 31).length === 3) YM.push(['大三元',13]);
    if(allHonor) YM.push(['字一色',13]);

  const c = c0.slice();

      const key = [-s, m, p, t];

      if(better){
        bestKey = key; best = {s, parts: cur.map(x => ({kind:x.kind, tiles:x.tiles.slice()}))};
      }
      return;
    }
    const push = (kind, tiles, fn) => { for(const x of tiles) c[x]--; cur.push({kind, tiles}); fn(); cur.pop(); for(const x of tiles) c[x]++; };
    if(c[i] >= 3) push('mentsu', [i,i,i], () => scan(i,m+1,t,p));
    if(i < 27 && i%9 <= 6 && c[i+1] && c[i+2]) push('mentsu', [i,i+1,i+2], () => scan(i,m+1,t,p));
    if(t < 6){
      if(c[i] >= 2) push('pair', [i,i], () => scan(i,m,t+1,p));
      if(i < 27 && i%9 <= 7 && c[i+1]) push('taatsu', [i,i+1], () => scan(i,m,t+1,p));
      if(i < 27 && i%9 <= 6 && c[i+2]) push('taatsu', [i,i+2], () => scan(i,m,t+1,p));
    }
    const sv = c[i]; c[i] = 0;
    for(let k = 0; k < sv; k++) cur.push({kind:'float', tiles:[i]});
    scan(i+1,m,t,p);
    for(let k = 0; k < sv; k++) cur.pop();
    c[i] = sv;
  };

const kou = t => [t,t,t];
const shun = (s,n) => [s*9+n, s*9+n+1, s*9+n+2];
const byNum = (a,b) => a-b;
function randGroup(){ return Math.random() < 0.28 ? kou(rnd(34)) : shun(rnd(3), rnd(7)); }
function makeHand(opt = {}){
  const gk = opt.group || (() => randGroup());
  const pk = opt.pair || (() => rnd(34));
  for(let k = 0; k < 1500; k++){
    const groups = [0,1,2,3].map(i => gk(i)); const pair = pk();
    const all = [...groups.flat(), pair, pair];
    const c = counts(all);
    if(c.some(x => x > 4)) continue;
    if(opt.check && !opt.check(groups, pair, c)) continue;

// 初級「役クイズ」用：すべての分解で役がつかない手か（知らない役も含めて）
function noYakuParse(p, yh){
  const g = [...p.mentsu];
  const kous = g.filter(x => !isShun(x));
  const shuns = g.filter(isShun);
  if(kous.length === 0 || kous.length >= 3) return false;
  if(kous.some(x => yh.includes(x[0]))) return false;
  const starts = shuns.map(x => x[0]);
  if(new Set(starts).size !== starts.length) return false;
  for(let s = 0; s < 3; s++) if([0,3,6].every(n => starts.includes(s*9+n))) return false;
  for(let n = 0; n < 7; n++) if([0,1,2].every(s => starts.includes(s*9+n))) return false;
  const all = [...g, [p.pair,p.pair]];
  if(all.every(x => x.some(isTermHonor))) return false;
  const tiles = all.flat();
  if(tiles.every(isSimple)) return false;
  if(new Set(tiles.filter(t => t < 27).map(suitOf)).size < 2) return false;

}

function yakuListHTML(list, han){
  return `<div class="card ykl">${list.map(y => `

}
function pointTable(){
  const fus = [20,25,30,40,50,60,70];
  const cell = (h,f,d,ts) => {
    if(f === 20 && (!ts || h < 2)) return '—';
    if(f === 25 && h < 2) return '—';
    const r = calcPoints(h,f,d,ts);
    return r.label ? `<span class="lim">${r.text}</span>` : r.text;
  };
  const tbl = (title, d, ts) => `<p class="small"><b>${title}</b></p><div class="tblwrap"><table class="tbl"><thead><tr><th>符＼翻</th><th>1翻</th><th>2翻</th><th>3翻</th><th>4翻</th></tr></thead><tbody>${
    fus.map(f => `<tr><td>${f}符</td>${[1,2,3,4].map(h => `<td>${cell(h,f,d,ts)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return tbl('子のロン', false, false) + tbl('子のツモ（子・親の払い）', false, true) + tbl('親のロン', true, false) + tbl('親のツモ', true, true);
}
function calcWidget(){
  return `<div class="card calc">
    <h3>点数計算機</h3>
    <div class="grid">
      <label>翻<select id="c-han">${Array.from({length:13},(_,i) => `<option value="${i+1}" ${i === 2 ? 'selected' : ''}>${i+1}翻${i === 12 ? '以上' : ''}</option>`).join('')}<option value="ym">役満</option></select></label>
      <label>符<select id="c-fu">${[20,25,30,40,50,60,70,80,90,100,110].map(f => `<option value="${f}" ${f === 30 ? 'selected' : ''}>${f}符</option>`).join('')}</select></label>
      <label>だれが上がった<div class="tog" id="c-who"><button aria-pressed="true" data-v="ko">子</button><button aria-pressed="false" data-v="oya">親</button></div></label>
      <label>上がり方<div class="tog" id="c-how"><button aria-pressed="true" data-v="ron">ロン</button><button aria-pressed="false" data-v="tsumo">ツモ</button></div></label>
    </div>
    <div class="out"><div class="v" id="c-out"></div><div class="s" id="c-sub"></div></div>
  </div>`;
}
function mountCalc(el){
  const upd = () => {
    const hv = el.querySelector('#c-han').value;
    const fu = +el.querySelector('#c-fu').value;
    const dealer = el.querySelector('#c-who [aria-pressed="true"]').dataset.v === 'oya';
    const tsumo = el.querySelector('#c-how [aria-pressed="true"]').dataset.v === 'tsumo';
    const r = hv === 'ym' ? calcPoints(0,0,dealer,tsumo,1) : calcPoints(+hv, fu, dealer, tsumo);
    el.querySelector('#c-out').textContent = tsumo ? `${r.text}（合計${r.total}点）` : `${r.text}点`;
    el.querySelector('#c-sub').textContent = (r.label ? r.label + '。' : `基本点 ${fu}×2^(${hv}+2) = ${r.base}。`) + (tsumo ? (dealer ? '子3人が同じ額を払う' : '左が子の払い、右が親の払い') : '振り込んだ人が全部払う');
  };
  el.querySelectorAll('.tog').forEach(t => t.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    t.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); upd();
  })));
  el.querySelectorAll('select').forEach(s => s.addEventListener('change', upd));
  upd();
}

<script>
// ===== 画面切り替え =====
const $ = s => document.querySelector(s);
const VIEWS = ['learn','lesson','practice','quiz','solo','sheet'];
const NAV_OF = {learn:'learn', lesson:'learn', practice:'practice', quiz:'practice', solo:'solo', sheet:'sheet'};
function show(v){
  for(const x of VIEWS) $('#v-' + x).hidden = x !== v;
  document.querySelectorAll('[data-nav]').forEach(b => b.getAttribute('data-nav') === NAV_OF[v] ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  document.body.classList.toggle('solo-mode', v === 'solo');
  if(v !== 'solo') $('#app').style.paddingBottom = '';
  window.scrollTo(0,0);
  store.set('view', NAV_OF[v]);
}
function goSolo(){ if(!G.wall) soloNew(); else soloRender(); show('solo'); fitRivers($('#v-solo')); layoutDock(); if(!store.get('guideSeen', false)){ store.set('guideSeen', true); openGuide(); } }
window.addEventListener('resize', () => { if(!$('#v-solo').hidden){ fitRivers($('#v-solo')); layoutDock(); } });
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
  const v = b.getAttribute('data-nav');
  if(v === 'learn'){ renderLearn(); show('learn'); }
  if(v === 'practice'){ renderPractice(); show('practice'); }
  if(v === 'solo') goSolo();
  if(v === 'sheet'){ renderSheet(); show('sheet'); }

function pickWrongTiles(correctList, c13, n = 3){
  const ref = correctList[0]; const s = suitOf(ref);

    const near = s < 3 && suitOf(t) === s && Math.abs(t - ref) <= 3;
    pool.push({t, w: near ? 3 : (suitOf(t) === s ? 2 : 1)});
  }
  const out = [];
  while(out.length < n && pool.length){
    const tot = pool.reduce((a,b) => a + b.w, 0); let x = Math.random()*tot, j = 0;
    for(; j < pool.length; j++){ x -= pool[j].w; if(x <= 0) break; }
    j = Math.min(j, pool.length-1); out.push(pool[j].t); pool.splice(j,1);
  }
  return out;
}

    if(mode === 0){ const add = pick(inSuit.filter(t => !alt.includes(t))); if(add === undefined) continue; alt.push(add); }
    else if(mode === 1 && alt.length > 1){ alt.splice(rnd(alt.length),1); }
    else { const add = pick(inSuit.filter(t => !alt.includes(t))); if(add === undefined) continue; alt[rnd(alt.length)] = add; }
    alt = [...new Set(alt)].sort(byNum);
    sets.set(setKey(alt), alt);
  }
  const opts = shuffle([...sets.values()].map(a => ({html:row(a,'xs'), ok:setKey(a) === setKey(w)})));
  return { q:`<p>チンイツのテンパイ。<b>待ちを全部</b>正しく言っているのはどれ？</p>${handRow([...t13, {t:0, cls:'ghost', gap:true}])}`, opts, cols:'one',
    ex:() => `<p>待ちは ${inlineT(w)} の<b>${w.length}種類</b>。</p>${w.map(t => `<div class="row small" style="gap:6px">${row([t],'xs')}<span>が来たら</span>${groupsHTML(parseToGroups(parseAgari(counts([...t13,t]))),'xs',false)}</div>`).join('')}` };
}
function fuBreakdownHTML(r){
  const raw = r.fuParts.reduce((a,b) => a + b[1], 0);
  return `<div class="fulist">${r.fuParts.map(([n,f]) => `<span>${n}</span><span>${f}符</span>`).join('')}
    <span class="tot">合計 ${raw}符${raw !== r.fu ? ' → 切り上げ' : ''}</span><span class="tot">${r.fu}符</span></div>`;
}
function genFu(){
  for(let k = 0; k < 60; k++){
    const h = makeHand({group: () => Math.random() < .38 ? kou(rnd(34)) : shun(rnd(3), rnd(7))});
    const tsumo = Math.random() < 0.45;
    const win = h.tiles[rnd(14)];
    const ctx = {win, tsumo, menzen:true, riichi:true, round:27, seat:28, dealer:false};
    const r = evaluate(h.c, ctx);
    if(!r || r.yakuman || r.p.type !== 'normal') continue;
    const t13 = h.tiles.slice(); t13.splice(t13.indexOf(win),1);
    const choices = [20,30,40,50,60,70,80].filter(f => f !== r.fu);
    const near = choices.sort((a,b) => Math.abs(a-r.fu) - Math.abs(b-r.fu)).slice(0,4);
    const wrong = shuffle(near).slice(0,3);
    const opts = [{html:`${r.fu}符`, ok:true}, ...wrong.map(f => ({html:`${f}符`, ok:false}))].sort((a,b) => parseInt(a.html) - parseInt(b.html));
    return { q:`<div class="ctx"><span class="chip">東場・南家</span><span class="chip red">リーチ</span><span class="chip gold">${tsumo ? 'ツモ' : 'ロン'}</span></div><p>この上がりは<b>何符</b>？</p>${handRow([...t13, {t:win, cls:'hl', tag:tsumo ? 'ツモ' : 'ロン', tagCls:'r', gap:true}])}`,
      opts, cols:'',
      ex:() => `${groupsHTML(parseToGroups(r.p),'xs')}<p class="small">${WAIT_NAME[r.wait]}待ちとして数える（${r.yaku.map(y => y[0]).join('・')}）。</p>${fuBreakdownHTML(r)}` };
  }
  return genPoints();
}
function genPoints(){
  const dealer = Math.random() < 0.4, tsumo = Math.random() < 0.45;
  let han, fu;
  if(Math.random() < 0.18){ han = 5 + rnd(9); fu = 30; }
  else {
    han = 1 + rnd(4);
    const fus = [30,40,50,60,70]; if(tsumo && han >= 2) fus.push(20); if(han >= 2) fus.push(25);
    fu = pick(fus);
  }
  const fmt = r => tsumo ? r.text : r.text + '点';
  const right = fmt(calcPoints(han, fu, dealer, tsumo));
  const set = new Set([right]);
  const variants = [[han+1,fu,dealer],[Math.max(1,han-1),fu,dealer],[han,fu+10,dealer],[han,Math.max(30,fu-10),dealer],[han,fu,!dealer],[han+2,fu,dealer]];
  for(const [h2,f2,d2] of shuffle(variants)){ if(set.size >= 4) break; set.add(fmt(calcPoints(h2,f2,d2,tsumo))); }
  const opts = shuffle([...set].map(s => ({html:s, ok:s === right})));
  const r = calcPoints(han, fu, dealer, tsumo);
  return { q:`<p>この上がりは何点？</p><div class="card stack" style="gap:6px;align-items:center;text-align:center"><div class="verdict">${han >= 5 ? `${han}翻` : `${han}翻 ${fu}符`}</div><div class="ctx" style="justify-content:center"><span class="chip gold">${dealer ? '親' : '子'}</span><span class="chip red">${tsumo ? 'ツモ' : 'ロン'}</span></div></div>`,
    opts, cols:'',
    ex:() => `<p>${r.label ? `<b>${r.label}</b>なので固定。` : `基本点 ${fu}×2<sup>${han+2}</sup> ＝ ${r.base}。`}${tsumo ? (dealer ? '親のツモは子3人が基本点×2ずつ。' : '子のツモは子が基本点×1、親が×2を払う。') : `${dealer ? '親' : '子'}のロンは基本点×${dealer ? 6 : 4}。`}100点未満は切り上げて <b>${right}</b>。</p>` };
}

let Q = null;
function startQuiz(id, from = null){ Q = {id, i:0, score:0, cur:null, answered:false, from}; show('quiz'); nextQ(); }
function nextQ(){ const def = QUIZ[Q.id]; if(Q.i >= def.n) return endQuiz(); Q.cur = def.gen(); Q.answered = false; renderQ(); }
function renderQ(){
  const def = QUIZ[Q.id]; const cur = Q.cur; const el = $('#v-quiz');
  el.innerHTML = `<div class="stack-l">
    <div class="stack" style="gap:8px"><div class="qhead"><button class="back" data-qback>‹ やめる</button><span class="small"><b>${Q.i+1}</b> / ${def.n} 問</span></div><div class="progress"><i style="width:${Q.i/def.n*100}%"></i></div></div>

    <div id="qex"></div></div>`;
  el.querySelector('[data-qback]').addEventListener('click', leaveQuiz);
  el.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => answer(+b.dataset.o)));
}
function answer(i){
  if(Q.answered) return; Q.answered = true;
  const cur = Q.cur; const ok = cur.opts[i].ok;
  if(ok) Q.score++;
  $('#v-quiz').querySelectorAll('[data-o]').forEach((b,j) => { b.disabled = true; if(cur.opts[j].ok) b.classList.add('right'); else if(j === i) b.classList.add('wrong'); });
  $('#qex').innerHTML = `<div class="card stack"><div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '正解！' : 'ざんねん'}</div>${cur.ex()}
    <button class="btn wide" data-nextq>${Q.i + 1 >= QUIZ[Q.id].n ? '結果を見る' : '次の問題'}</button></div>`;
  $('#qex').querySelector('[data-nextq]').addEventListener('click', () => { Q.i++; nextQ(); window.scrollTo(0,0); });
  $('#qex').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'nearest'});
}
function endQuiz(){
  const def = QUIZ[Q.id];
  const best = store.get('best_' + Q.id, 0); if(Q.score > best) store.set('best_' + Q.id, Q.score);
  const r = Q.score / def.n;
  const msg = r === 1 ? 'パーフェクト！ 完全に覚えた。' : r >= .7 ? 'いい感じ！ あと少し。' : 'まだ慣れてないだけ。もう1回やれば伸びる。';
  const el = $('#v-quiz');
  el.innerHTML = `<div class="stack-l"><span class="eyebrow">${def.title}</span>
    <div class="card stack" style="align-items:center;text-align:center"><div class="score-big">${Q.score}<span style="font-size:24px"> / ${def.n}</span></div><p>${msg}</p></div>
    <button class="btn wide" data-again>もう1回</button>
    ${Q.from ? `<button class="btn wide sub" data-tolesson>レッスンに戻る</button>` : ''}
    <button class="btn wide sub" data-toprac>クイズ一覧へ</button></div>`;
  el.querySelector('[data-again]').addEventListener('click', () => startQuiz(Q.id, Q.from));
  const tl = el.querySelector('[data-tolesson]'); if(tl) tl.addEventListener('click', () => openLesson(...Q.from));
  el.querySelector('[data-toprac]').addEventListener('click', () => { renderPractice(); show('practice'); });
}
function leaveQuiz(){ if(Q && Q.from) openLesson(...Q.from); else { renderPractice(); show('practice'); } }
function renderPractice(){
  const el = $('#v-practice');
  el.innerHTML = `<div class="stack-l">
    <div class="stack" style="gap:6px"><h2>クイズで練習</h2><p class="muted small">何回でも出題が変わる。レッスンと同じレベルから選ぼう。</p></div>
    <div class="qlist">${LEVELS.map((lv,li) => `<p class="qlevel">${lv.name}</p>` + Object.entries(QUIZ).filter(([,d]) => d.lv === li).map(([id,d]) => {
      const b = store.get('best_' + id, null);
      return `<button class="qcard" data-q="${id}"><span class="t">${d.title}</span><span class="sc">${b === null ? '未挑戦' : `最高<b>${b}/${d.n}</b>`}</span><span class="d">${d.desc}</span></button>`;
    }).join('')).join('')}
    <p class="qlevel">実践</p>
    <button class="qcard big" data-go="solo"><span class="t">一人麻雀</span><span class="sc" style="color:inherit">›</span><span class="d">4人卓で1局。ロン・ポン・チーもできる（相手は妨害なし）</span></button></div></div>`;
  el.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => startQuiz(b.dataset.q)));
  el.querySelector('[data-go]').addEventListener('click', goSolo);
}
</script>
<script>
// ===== 一人麻雀（4人卓・相手は妨害なし） =====
// 自分=東家（親）。相手3人は山からツモって捨てるだけ（鳴き・リーチ・上がりはしない）。
const SEAT_LABEL = ['自分','下家','対面','上家'];
const SEAT_WIND = [27,28,29,30];
const G = {};
let soloToken = 0;
const PART_LABEL = {mentsu:'面子', head:'アタマ', pair:'対子', taatsu:'ターツ', float:'浮き'};
const later = (fn, ms) => { const tok = soloToken; setTimeout(() => { if(tok === soloToken) fn(); }, ms); };

function setHintLevel(lv){ G.lv = lv; G.hint = lv > 0; G.full = lv === 2; store.set('hintLevel', lv); }
function soloNew(){
  const wall = []; for(let t = 0; t < 34; t++) for(let k = 0; k < 4; k++) wall.push(t);
  shuffle(wall);
  const dead = wall.splice(0,14);
  Object.assign(G, {
    wall, rinshan: dead.slice(0,4), doraInds:[dead[4]], uraInds:[dead[5]], deadRest: dead.slice(6),
    hands:[0,1,2,3].map(() => wall.splice(0,13).sort(byNum)), rivers:[[],[],[],[]], melds:[],
    drawn:null, phase:'mine', riichi:false, rmode:false, riichiIdx:-1, ippatsu:false, double:false,
    furitenTemp:false, furitenRiichi:false, firstTurn:true, lastRinshan:false, kuikae:[], callOpt:null,
    sel:null, fb:null, an:null, over:false, result:null, myDiscards:0, lastDiscard:null, info:null
  });
  setHintLevel(store.get('hintLevel', store.get('hint', true) ? 2 : 0));
  soloToken++;
  const st = store.get('solo', {plays:0, wins:0}); st.plays++; store.set('solo', st);
  myDraw(false);
}
const nm = () => G.melds.length;
const menzenNow = () => G.melds.every(m => m.type === 'ankan');
const myConcealed = () => G.drawn === null ? G.hands[0].slice() : [...G.hands[0], G.drawn];
function visibleTiles(){
  const v = [...G.doraInds];
  for(const r of G.rivers) for(const d of r) v.push(d.t);
  for(const m of G.melds) v.push(...m.tiles);
  return v;
}
function baseCtx(extra){
  return Object.assign({round:27, seat:27, dealer:true, dora:G.doraInds, ura:G.uraInds, melds:G.melds, riichi:G.riichi, doubleRiichi:G.double, ippatsu:G.riichi && G.ippatsu}, extra);
}
function rankOpt(extra){ return Object.assign({round:27, seat:27, doras:G.doraInds.map(doraOf)}, extra); }
function myRiverTypes(){ return G.rivers[0].map(d => d.t); }

// ---- 自分のツモ ----
function myDraw(rinshan){
  if(!rinshan && G.wall.length === 0){ soloRyukyoku(); return; }
  G.actor = 0;
  G.drawn = rinshan ? G.rinshan.pop() : G.wall.pop();
  if(rinshan && G.wall.length) G.deadRest.push(G.wall.shift());
  G.lastRinshan = rinshan;
  G.furitenTemp = false;
  G.phase = 'mine'; G.sel = null; G.callOpt = null;
  const all = myConcealed();
  const c = counts(all);
  G.tsumoRes = null; G.tsumoNoYaku = false;
  if(parseAgari(c, nm())){
    const r = evaluate(c, baseCtx({win:G.drawn, tsumo:true, haitei:G.wall.length === 0 && !rinshan, rinshan, tenhou:G.firstTurn && nm() === 0}));
    if(r && r.yaku.length) G.tsumoRes = r; else G.tsumoNoYaku = true;
  }
  G.an = rankDiscards(analyze14(all, visibleTiles(), nm()), rankOpt());
  soloRender();
  if(G.riichi && !G.tsumoRes) later(() => myDiscard(G.drawn, true), 750);
}
function kanOptions(){
  if(G.phase !== 'mine' || G.riichi || G.wall.length === 0 || G.rinshan.length === 0) return [];
  const c = counts(myConcealed()); const out = [];
  for(let t = 0; t < 34; t++) if(c[t] === 4) out.push({kind:'ankan', t});
  for(const m of G.melds) if(m.type === 'pon' && c[m.tiles[0]] >= 1) out.push({kind:'kakan', t:m.tiles[0]});
  return out;
}
function doKanSelf(opt){
  const t = opt.t;
  const all = myConcealed();
  if(opt.kind === 'ankan'){
    let k = 0; const rest = all.filter(x => !(x === t && k++ < 4));
    G.hands[0] = rest.sort(byNum);
    G.melds.push({type:'ankan', tiles:[t,t,t,t], from:0});
  } else {
    const i = all.indexOf(t); all.splice(i,1); G.hands[0] = all.sort(byNum);
    const m = G.melds.find(x => x.type === 'pon' && x.tiles[0] === t); m.type = 'kakan'; m.tiles = [t,t,t,t];
  }
  G.drawn = null; G.firstTurn = false; G.ippatsu = false;
  revealKanDora();
  G.fb = {k:'good', html:`<b>カン！</b> 嶺上牌（リンシャンハイ）を1枚ひいて、ドラ表示牌が1枚増えた。`};
  myDraw(true);
}
function revealKanDora(){ if(G.deadRest.length >= 2){ G.doraInds.push(G.deadRest.shift()); G.uraInds.push(G.deadRest.shift()); } }

// ---- 自分の打牌 ----
function myDiscard(t, auto = false){
  if(G.over || !(G.phase === 'mine' || G.phase === 'afterCall')) return;
  const all = myConcealed();
  if(!all.includes(t)) return;
  if(G.kuikae.includes(t)) return;
  if(G.rmode && G.an.res[t].s !== 0) return;
  if(!auto && G.hint && G.an){
    const mine = G.an.res[t], bestT = G.an.best;
    if(bestT.includes(t)) G.fb = {k:'good', html:`<b>ナイス！</b>`};
    else if(mine.s === G.an.bestS){
      const pr = {parts: mergeAttached(partsOf(counts(myConcealed()), nm()).parts)};
      G.fb = mine.n < G.an.bestN
        ? {k:'ok', html:`<b>惜しい</b> ${inlineT(bestT.slice(0,1))}なら${G.an.bestN}枚（今は${mine.n}枚）`}
        : {k:'ok', html:`<b>惜しい</b> 先に切るなら${inlineT(bestT.slice(0,1))}（${reasonShort(bestT[0], pr.parts)}）`};
    }
    else G.fb = {k:'bad', html:`<b>遠回り</b> ${inlineT(bestT.slice(0,1))}を切れば1歩近かった`};
  } else if(!auto) G.fb = null;
  const tsumogiri = G.drawn === t;
  if(tsumogiri) G.drawn = null;
  else { all.splice(all.indexOf(t),1); G.drawn = null; }
  G.hands[0] = (tsumogiri ? G.hands[0] : all).sort(byNum);
  let riichiNow = false;
  if(G.rmode){ G.riichi = true; G.rmode = false; G.riichiIdx = G.rivers[0].length; G.ippatsu = true; G.double = G.firstTurn; riichiNow = true;
    G.fb = {k:'good', html:`<b>${G.double ? 'ダブルリーチ' : 'リーチ'}！</b> 1000点棒を出した。ここからは上がり牌が来るまで自動でツモ切り。`}; }
  else if(G.riichi) G.ippatsu = false;
  G.rivers[0].push({t, riichi:riichiNow, tsumogiri});
  G.lastDiscard = {t, from:0};
  G.firstTurn = false; G.kuikae = []; G.sel = null; G.myDiscards++;
  G.phase = 'wait';
  soloRender();
  later(() => oppTurn(1), 420);
}

// ---- 相手の番（ツモって捨てるだけ） ----
function aiDiscard(hand){
  const c = counts(hand); let best = 99, cands = [];
  for(let t = 0; t < 34; t++){ if(!c[t]) continue; c[t]--; const s = shanten(c); c[t]++; if(s < best){ best = s; cands = [t]; } else if(s === best) cands.push(t); }
  const pref = cands.filter(isTermHonor);
  return pick(pref.length ? pref : cands);
}
function oppTurn(i){
  if(G.over) return;
  if(G.wall.length === 0){ soloRyukyoku(); return; }
  G.actor = i;
  const t0 = G.wall.pop(); G.hands[i].push(t0);
  const d = aiDiscard(G.hands[i]);
  G.hands[i].splice(G.hands[i].indexOf(d),1);
  G.rivers[i].push({t:d, tsumogiri: d === t0});
  G.lastDiscard = {t:d, from:i};
  const opt = callOptions(d, i);
  if(opt){ G.callOpt = opt; G.phase = 'call'; soloRender(); return; }
  soloRender();
  continueAfter(i);
}
function continueAfter(i){
  if(G.over) return;
  if(i === 3) later(() => myDraw(false), 380);
  else later(() => oppTurn(i+1), 380);
}
function discardFuriten(waits){ const r = myRiverTypes(); return waits.some(w => r.includes(w)); }
function callOptions(t, from){
  const hand = G.hands[0];
  const c = counts([...hand, t]);
  const opt = {t, from, ron:null, pon:false, kan:false, chi:[], adv:{}};
  const last = G.wall.length === 0;
  if(parseAgari(c, nm())){
    const r = evaluate(c, baseCtx({win:t, tsumo:false, houtei:last}));
    const waits = waitsOf(counts(hand), nm());
    const fr = discardFuriten(waits) ? 'river' : G.furitenRiichi ? 'riichi' : G.furitenTemp ? 'temp' : null;
    opt.ron = {res:r, ok: !!(r && r.yaku.length) && !fr, noYaku: !(r && r.yaku.length), furiten: fr};
  }
  if(!G.riichi && !last){
    const k = hand.filter(x => x === t).length;
    if(k >= 2) opt.pon = true;
    if(k >= 3 && G.rinshan.length > 0) opt.kan = true;
    if(from === 3 && t < 27){
      const s = suitOf(t), n = t % 9;
      for(const [a,b] of [[-2,-1],[-1,1],[1,2]]){
        if(n+a < 0 || n+b > 8) continue;
        const x = s*9+n+a, y = s*9+n+b;
        if(hand.includes(x) && hand.includes(y)) opt.chi.push([x,y]);
      }
    }
  }
  const any = (opt.ron && (opt.ron.ok || G.full)) || opt.pon || opt.kan || opt.chi.length;
  if(!any) return null;
  if(opt.pon) opt.adv.pon = callAdvice('pon', [t,t,t], [t,t]);
  opt.chi.forEach(pr => { opt.adv['chi' + pr.join('-')] = callAdvice('chi', [...pr, t].sort(byNum), pr); });
  if(opt.kan) opt.adv.kan = callAdvice('minkan', [t,t,t,t], [t,t,t]);
  return opt;
}
// 鳴くべきかのアドバイス
function callAdvice(type, meldTiles, useTiles){
  const hand = G.hands[0].slice();
  for(const u of useTiles) hand.splice(hand.indexOf(u),1);
  const n2 = nm() + 1;
  const cur = shanten(counts(G.hands[0]), nm());
  let after;
  if(type === 'minkan') after = shanten(counts(hand), n2);
  else { after = 99; const c = counts(hand); for(let x = 0; x < 34; x++){ if(!c[x]) continue; c[x]--; after = Math.min(after, shanten(c, n2)); c[x]++; } }
  const t = meldTiles[0];
  const yakuhaiMeld = type !== 'chi' && [27,31,32,33].includes(t);
  const hasYakuhai = G.melds.some(m => m.type !== 'chi' && [27,31,32,33].includes(m.tiles[0]));
  const allMeldSimple = [...G.melds.flatMap(m => m.tiles), ...meldTiles].every(isSimple);
  const nonSimpleLeft = hand.filter(x => !isSimple(x)).length;
  const tanyaoOk = allMeldSimple && nonSimpleLeft <= 2;
  let yaku = null;
  if(yakuhaiMeld) yaku = `${HONOR[t-27]}は役牌なので、鳴いた時点で<b>役が確定</b>する`;
  else if(hasYakuhai) yaku = 'もう役牌を鳴いているので役はある';
  else if(tanyaoOk) yaku = `<b>タンヤオ</b>狙いで鳴ける（残りの1・9・字牌${nonSimpleLeft ? `${nonSimpleLeft}枚` : ''}を捨てていこう）`;
  const faster = after < cur;
  if(type === 'minkan'){
    if(menzenNow() && !hasYakuhai && !yakuhaiMeld) return {rec:false, why:'カンすると鳴いたことになり、リーチができなくなる。<b>スルー</b>がおすすめ。'};
    return {rec:!!yaku, why: yaku ? `${yaku}。カンするとドラも1枚増える。` : '役がないのでスルーがおすすめ。'};
  }
  if(!yaku) return {rec:false, why:`鳴くと<b>リーチができなくなり、役がなくなる</b>。${faster ? 'テンパイには近づくけど、' : ''}ここは<b>スルー</b>してリーチを目指そう。`};
  if(!faster) return {rec:false, why:`${yaku}けど、鳴いてもテンパイに近づかない。<b>スルー</b>でOK。`};

// ---- ヒント（初心者向けの情報） ----
// 面子やアタマの隣にある浮き牌は「くっつき」としてその組に入れて見せる（例：3444 は 面子+1）
function mergeAttached(parts){
  const out = parts.map(p => ({kind:p.kind, tiles:p.tiles.slice(), plus:0}));
  for(const f of out){
    if(f.kind !== 'float' || f.tiles[0] >= 27) continue;
    const t = f.tiles[0];
    const host = out.find(p => (p.kind === 'mentsu' || p.kind === 'head' || p.kind === 'pair') && !p.plus && p.tiles[0] < 27 && suitOf(p.tiles[0]) === suitOf(t) && p.tiles.some(x => Math.abs(x - t) <= 2));
    if(host){ host.tiles.push(t); host.tiles.sort(byNum); host.plus = 1; f.merged = true; }
  }
  return out.filter(p => !p.merged);
}
const partLabel = p => PART_LABEL[p.kind] + (p.plus ? '+1' : '');
function waitYakuInfo(c13){
  const waits = waitsOf(c13, nm());
  if(!waits.length) return null;
  let ronOk = false, tsumoOk = false, names = new Set();
  for(const w of waits){
    const c = c13.slice(); c[w]++;
    const r1 = evaluate(c, baseCtx({win:w, tsumo:false}));
    const r2 = evaluate(c, baseCtx({win:w, tsumo:true}));
    if(r1 && r1.yaku.length){ ronOk = true; r1.yaku.forEach(y => { if(!/ドラ|リーチ|一発/.test(y[0])) names.add(baseYaku(y[0])); }); }
    if(r2 && r2.yaku.length) tsumoOk = true;
  }
  const fr = discardFuriten(waits);
  let yakuText;
  if(G.riichi) yakuText = 'リーチしているので、どれが来ても上がれる。';
  else if(ronOk) yakuText = `役あり（${[...names].join('・') || '—'}）。ロンでもツモでも上がれる。`;
  else if(menzenNow()) yakuText = `<b>役なし</b>。ロンはできない。<b>リーチ</b>すれば上がれる（ツモなら上がれる）。`;
  else if(tsumoOk) yakuText = '<b>役なし</b>。ツモ限定の役しかない。';
  else yakuText = '<b style="color:var(--red)">役なしで上がれない！</b> 鳴いた手は役牌かタンヤオが必要。';
  return {waits, yakuText, furiten: fr};
}
function keepNote(t){
  if(t >= 27){
    const yh = [31,32,33].includes(t) ? 1 : 0, dbl = t === 27;
    if(dbl) return '東は東場の親にとって<b>ダブ東</b>（2翻）。重なればおいしいので残したかった。';
    if(yh) return `${HONOR[t-27]}は<b>役牌</b>。もう1枚来ればアタマ、3枚で役になるので残したかった。`;
    return '';
  }
  const n = t % 9;
  if(G.doraInds.map(doraOf).includes(t)) return `${tileShort(t)}は<b>ドラ</b>なので残したかった。`;
  if(n >= 2 && n <= 6) return `${tileShort(t)}は真ん中の数字で、前後どちらにもつながりやすい。`;
  return '';
}
function discardReason(t, parts){
  const p = parts.find(x => x.tiles.includes(t));
  const doras = G.doraInds.map(doraOf);
  if(!p) return '上がりに近づく牌がいちばん多く残る';
  if(p.plus) return `${PART_LABEL[p.kind]}にくっついている1枚。受けを少し広げるけど、ほかの牌より役目が小さい`;
  if(p.kind === 'float'){
    const keeps = parts.filter(x => x.kind === 'float' && x.tiles[0] !== t && (x.tiles[0] >= 27 && keepValue(x.tiles[0], {round:27, seat:27}) > 0 || doras.includes(x.tiles[0]))).map(x => x.tiles[0]);
    const keepText = keeps.length ? `（${keeps.map(tileShort).join('・')}は${keeps.every(k => k >= 27) ? '役牌' : keeps.every(k => doras.includes(k)) ? 'ドラ' : '役牌やドラ'}なので残す）` : '';
    if(t >= 27) return ([27,31,32,33].includes(t) ? 'ポツンと1枚の字牌（役牌だけど、ほかに捨てる牌がない）' : 'ポツンと1枚の<b>オタ風</b>。役にもならず使い道がない') + keepText;
    if(isTermHonor(t)) return 'ポツンと1枚の<b>端っこ（1・9）</b>。つながる牌が少ない' + keepText;
    const n = t % 9;
    if(n === 1 || n === 7) return 'ポツンと1枚の<b>2・8</b>。真ん中の牌より伸びにくい' + keepText;
    return 'どこにもつながっていない<b>浮き牌</b>' + keepText;
  }
  if(p.kind === 'taatsu') return 'ターツが多すぎる。形の悪いターツ（嵌張・辺張）から減らす';
  if(p.kind === 'pair') return '対子が多すぎるので1つ減らす';
  return '上がりに近づく牌がいちばん多く残る';
}
// 短い理由（ヒント欄用）
function reasonShort(t, parts){
  const p = parts.find(x => x.tiles.includes(t));
  if(!p) return '受け入れが最大';
  if(p.plus) return 'くっつきの1枚';
  if(p.kind === 'float'){
    if(t >= 27) return [27,31,32,33].includes(t) ? '重ならない役牌' : '使い道のないオタ風';
    if(isTermHonor(t)) return 'つながりにくい端っこ';
    if(t % 9 === 1 || t % 9 === 7) return '伸びにくい2・8';
    return 'どこにもつながらない';
  }
  if(p.kind === 'taatsu') return 'ターツが多すぎ・形の悪い方';
  if(p.kind === 'pair') return '対子が多すぎ';

function yakuShort(info){

function hintPanel(){

  const drawn = `<div class="grp3 drawn">${h.drawn !== null ? tileBtn({t:h.drawn, drawn:true}, 99) : '<div class="slot ph"></div>'}${h.drawn !== null && h.grouped ? '<span class="gl3 dl">ツモ</span>' : ''}</div>`;
  return `<div class="hand3">${body}${drawn}</div>`;
}
function meldsHTML(){
  return `<div class="melds">${G.melds.map(m => `<div class="meld">${m.tiles.map((t,k) => tileHTML(t, (m.type === 'ankan' && (k === 0 || k === 3)) ? 'back' : (m.called === t && k === m.tiles.indexOf(t) && m.type !== 'ankan') ? 'side' : '')).join('')}<span class="ml">${{pon:'ポン',chi:'チー',minkan:'明槓',ankan:'暗槓',kakan:'加槓'}[m.type]}</span></div>`).join('')}</div>`;
}
function callParts(){
  const o = G.callOpt; if(!o || G.phase !== 'call') return null;
  const who = SEAT_LABEL[o.from];
  let msg = `<b>${who}</b>が ${inlineT([o.t])} を捨てた。`;
  const btns = [];
  if(o.ron){
    if(o.ron.ok){ msg += `<br><b style="color:var(--red)">ロンできる！</b>（${o.ron.res.yaku.filter(y => !/ドラ/.test(y[0])).map(y => y[0]).join('・')}）`; btns.push(`<button class="btn red" data-call="ron">ロン</button>`); }
    else if(o.ron.furiten) msg += `<br><span class="small">形は完成したけど<b>フリテン</b>でロンできない（${o.ron.furiten === 'river' ? '待ちの牌を自分で捨てている' : o.ron.furiten === 'riichi' ? 'リーチ後に見逃した' : '直前に見逃した'}）。</span>`;
    else if(o.ron.noYaku) msg += `<br><span class="small">形は完成したけど<b>役なし</b>でロンできない。${menzenNow() ? 'リーチしていれば上がれた！' : ''}</span>`;
  }
  const adv = [];
  if(o.pon){ const a = o.adv.pon; btns.push(`<button class="btn ${G.full && a.rec ? 'gold' : 'sub'}" data-call="pon">ポン</button>`); if(G.full) adv.push(`<b>ポン：</b>${a.why}`); }
  o.chi.forEach(pr => { const a = o.adv['chi' + pr.join('-')]; btns.push(`<button class="btn chi ${G.full && a.rec ? 'gold' : 'sub'}" data-call="chi" data-pr="${pr.join(',')}">チー ${row([...pr, o.t].sort(byNum),'xs')}</button>`); if(G.full) adv.push(`<b>チー${row([...pr, o.t].sort(byNum),'xs')}：</b>${a.why}`); });
  if(o.kan){ const a = o.adv.kan; btns.push(`<button class="btn ${G.full && a.rec ? 'gold' : 'sub'}" data-call="kan">カン</button>`); if(G.full) adv.push(`<b>カン：</b>${a.why}`); }
  const passRec = !(o.ron && o.ron.ok) && !(o.pon && o.adv.pon.rec) && !o.chi.some(pr => o.adv['chi' + pr.join('-')].rec) && !(o.kan && o.adv.kan.rec);
  btns.push(`<button class="btn ${G.full && passRec ? 'gold' : 'sub'}" data-call="pass">スキップ</button>`);
  const info = `<div class="callbar"><div class="small">${msg}</div>${adv.length ? `<div class="adv small">${adv.map(a => `<div>${a}</div>`).join('')}</div>` : ''}${G.full ? '<div class="small muted">迷ったら<b style="color:var(--gold)">金色</b>のボタン</div>' : ''}</div>`;
  return {info, btns: `<div class="cbtns">${btns.join('')}</div>`};
}
// 役の見通し（初心者の最大の落とし穴「役なし」を防ぐ）
function yakuOutlook(){
  if(G.riichi) return '<b style="color:var(--ok)">リーチ中</b>';
  const conc = G.phase === 'mine' ? myConcealed() : G.hands[0].slice();
  const c = counts(conc);
  const yhT = [27,31,32,33];
  const openYakuhai = G.melds.some(m => m.type !== 'chi' && yhT.includes(m.tiles[0]));
  const handKou = yhT.filter(t => c[t] >= 3);
  const handPair = yhT.filter(t => c[t] === 2);
  const allTiles = conc.concat(G.melds.flatMap(m => m.tiles));
  const nonSimple = allTiles.filter(t => !isSimple(t)).length;
  const meldsSimple = G.melds.flatMap(m => m.tiles).every(isSimple);
  const parts = [];
  if(openYakuhai || handKou.length) parts.push(`<b style="color:var(--ok)">役牌あり</b>`);
  if(meldsSimple && nonSimple === 0) parts.push(`<b style="color:var(--ok)">タンヤオ</b>`);
  else if(meldsSimple && nonSimple <= 2) parts.push(`タンヤオまで1・9・字牌あと${nonSimple}枚`);
  if(handPair.length && !handKou.length) parts.push(`${handPair.map(t => HONOR[t-27]).join('・')}の対子→ポンで役`);
  if(menzenNow()) parts.unshift('リーチすればOK');
  else if(!openYakuhai && !handKou.length && !(meldsSimple && nonSimple === 0)) parts.unshift('<b style="color:var(--red)">まだ役なし！</b>');
  return parts.join('／');
}
// 捨て牌は常に1行。枚数が増えたら牌を小さくして収める
function fitRivers(el){
  el.querySelectorAll('.table4 .rt').forEach(rt => {
    const n = rt.querySelectorAll('.tile').length; if(!n) return;
    const w = rt.clientWidth; if(!w) return;
    const tw = Math.max(9, Math.min(18, Math.floor((w - 2*(n-1) - 8) / n)));
    rt.style.setProperty('--rtw', tw + 'px');
  });
}
function layoutDock(){
  const app = $('#app'), dock = document.querySelector('#v-solo .dock'), nav = document.querySelector('.nav');
  if(!dock || $('#v-solo').hidden){ app.style.paddingBottom = ''; return; }

  const navH = navVisible ? nav.offsetHeight : 0;
  document.documentElement.style.setProperty('--navh', navH + 'px');
  app.style.paddingBottom = (dock.offsetHeight + navH + 10) + 'px';
}

  }));
  const gb = el.querySelector('[data-guide]'); if(gb) gb.addEventListener('click', openGuide);
  const mb = el.querySelector('[data-menu]'); if(mb) mb.addEventListener('click', () => { renderLearn(); show('learn'); });

  const ts = el.querySelector('[data-tsumo]'); if(ts) ts.addEventListener('click', () => soloWin('tsumo'));

function openSheet(html, kind = ''){
  const root = $('#overlay-root');
  root.innerHTML = `<div class="overlay modal"><div class="sheet modal ${kind}" role="dialog" aria-modal="true">${html}</div></div>`;
  const close = () => { root.innerHTML = ''; };
  root.querySelector('.overlay').addEventListener('click', e => { if(e.target.classList.contains('overlay')) close(); });
  const n = root.querySelector('[data-sheet-new]'); if(n) n.addEventListener('click', () => { close(); soloNew(); window.scrollTo(0,0); });
